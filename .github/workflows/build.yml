name: Build iOS for marble (Note12Turbo)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y device-tree-compiler gcc-aarch64-linux-gnu make mkbootimg android-sdk-libsparse-utils

      - name: Chmod script
        run: chmod +x ./build-marble.sh

      - name: Run build
        run: ./build-marble.sh

      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: build-out
          path: out/
